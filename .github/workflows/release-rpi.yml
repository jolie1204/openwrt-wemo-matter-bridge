name: Release Raspberry Pi images

on:
  push:
    tags:
      - "openwrt-rpi-v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      target:
        description: "Raspberry Pi target to build"
        required: true
        default: "rpi4"
        type: choice
        options:
          - rpi4
          - rpi5
          - all
      package_only:
        description: "Build packages only, without full firmware images"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 720

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl ccache python3 \
            python3-venv qemu-utils

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: openwrt-dl-${{ runner.os }}-${{ hashFiles('feeds.conf.default', 'package/network/services/wemo-matter-bridge/Makefile') }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-

      - name: Build Raspberry Pi release artifacts
        env:
          JOBS: "2"
          VERSION: ${{ github.ref_name }}
        run: |
          target="${{ github.event.inputs.target || '' }}"
          if [[ -z "$target" ]]; then
            target="all"
          fi
          args=(--target "$target")
          if [[ "${{ github.event.inputs.package_only || 'false' }}" == "true" ]]; then
            args+=(--package-only)
          fi
          scripts/release/build_rpi_release.sh "${args[@]}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpi-release-assets
          path: dist/*

      - name: Upload GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release/stage_usage_release_assets.sh "${GITHUB_REF_NAME}"
          gh release create "${GITHUB_REF_NAME}" dist/openwrt-rpi/* \
            --title "OpenWeMo Raspberry Pi OpenWrt Firmware ${GITHUB_REF_NAME#openwrt-rpi-}" \
            --notes-file dist/openwrt-rpi/README.txt \
            --repo "${GITHUB_REPOSITORY}"
